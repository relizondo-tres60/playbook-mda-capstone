# ─────────────────────────────────────────────────────────────────────────────
# Backend Playbook MDA Capstone — configuracion de despliegue
# Ubicacion: RAIZ del repositorio relizondo-tres60/playbook-mda-capstone
# Workers Builds ejecuta "npx wrangler deploy" desde la raiz.
# ─────────────────────────────────────────────────────────────────────────────

name               = "playbook-mda-capstone"
main               = "worker.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "MDA_KV"
id      = "6e083200070d4fbbbdd3236513c34536"

[vars]
PAGES_URL  = "https://playbook-mda.pages.dev"
WORKER_URL = "https://playbook-mda-capstone.relizondo-0d3.workers.dev"

# ─────────────────────────────────────────────────────────────────────────────
# Variables sensibles: NO se declaran aqui. Cargarlas como Secret en
# Workers & Pages > playbook-mda-capstone > Settings > Variables and secrets:
#   GOOGLE_CLIENT_ID      (Google Cloud Console — OAuth client tipo External)
#   GOOGLE_CLIENT_SECRET  (Google Cloud Console)
#   ANTHROPIC_API_KEY     (opcional — habilita el asistente IA en /chat)
# ─────────────────────────────────────────────────────────────────────────────
