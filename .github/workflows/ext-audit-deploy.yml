name: ext-audit Deploy

# Despliegue a Cloudflare Workers (+ assets del frontend) y migraciones de D1.
# Requiere los secretos de repositorio CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "ext-audit/**"
      - ".github/workflows/ext-audit-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de despliegue"
        required: true
        default: production
        type: choice
        options: [production]

defaults:
  run:
    working-directory: ext-audit

concurrency:
  group: ext-audit-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar a Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar antes de desplegar
        run: |
          node scripts/check-syntax.mjs
          python3 scripts/check-schema.py
          node --test test/*.test.js

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Aplicar migraciones de D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ext_audit --remote --env production

      - name: Desplegar Worker y assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Verificar salud del despliegue
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.EXT_AUDIT_BASE_URL || 'https://ext-audit.tres60.cl' }}/api/health" | tee /tmp/health.json; then
              grep -q '"status":"ok"' /tmp/health.json && exit 0
            fi
            echo "Reintento $i..."
            sleep $((2 ** i))
          done
          echo "El endpoint /api/health no respondio correctamente"
          exit 1
