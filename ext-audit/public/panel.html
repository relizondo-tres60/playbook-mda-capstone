<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel interno | Auditoria de Cuentas Externas</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/config.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128202;</text></svg>">
</head>
<body>

<header class="topbar">
  <div>
    <h1>Auditoria de Cuentas Externas (EXT)</h1>
    <div class="sub">Active Directory &middot; validacion mensual con administradores de contrato</div>
  </div>
  <div class="spacer"></div>
  <div style="min-width:230px;">
    <label for="campaign-select" style="color:#c5dded;">Campana</label>
    <select id="campaign-select"></select>
  </div>
  <div class="user" id="user-info"></div>
  <button class="secondary small" id="logout">Salir</button>
</header>

<nav class="tabs">
  <button data-view="resumen" class="active">Resumen</button>
  <button data-view="importar">Importar</button>
  <button data-view="cuentas">Cuentas</button>
  <button data-view="envios">Envios y seguimiento</button>
  <button data-view="empresas">Empresas</button>
  <button data-view="administradores">Administradores</button>
  <button data-view="auditoria">Auditoria</button>
  <button data-view="config">Configuracion</button>
</nav>

<main>
  <div id="global-alert"></div>

  <section class="view active" id="view-resumen"><div class="loading">Cargando...</div></section>
  <section class="view" id="view-importar"></section>
  <section class="view" id="view-cuentas"></section>
  <section class="view" id="view-envios"></section>
  <section class="view" id="view-empresas"></section>
  <section class="view" id="view-administradores"></section>
  <section class="view" id="view-auditoria"></section>
  <section class="view" id="view-config"></section>
</main>

<div id="modal-root"></div>

<script type="module" src="/js/panel.js"></script>
</body>
</html>
