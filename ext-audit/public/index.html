<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso | Auditoria de Cuentas Externas</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/config.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128274;</text></svg>">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Auditoria de Cuentas Externas</h1>
    <div class="sub">Panel interno &middot; cuentas EXT de Active Directory</div>

    <div id="alert"></div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">Correo corporativo</label>
        <input type="email" id="email" name="email" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submit">Ingresar</button>
    </form>

    <div class="footer-note" style="padding:18px 0 0 0;">
      Si usted es administrador de contrato de una empresa externa,
      use el enlace personal que recibio por correo.
    </div>
  </div>
</div>

<script type="module">
import { post, ApiError } from '/js/api.js';

const form = document.getElementById('login-form');
const alertBox = document.getElementById('alert');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.innerHTML = '';
  submit.disabled = true;
  submit.textContent = 'Verificando...';
  try {
    await post('/api/auth/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    window.location.href = '/panel';
  } catch (err) {
    const msg = err instanceof ApiError ? err.message : 'No fue posible conectar con el servidor';
    alertBox.innerHTML = `<div class="alert danger">${msg.replace(/</g, '&lt;')}</div>`;
    submit.disabled = false;
    submit.textContent = 'Ingresar';
  }
});
</script>
</body>
</html>
